name: Run Bashcov CI

on:
  # Run on pushes to master only; PR commits are covered by pull_request,
  # so this avoids running the whole matrix twice for every PR push.
  push:
    branches: ["master"]
  pull_request:
  schedule:
    - cron: "0 0 * * 0" # run weekly on Sundays

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    container: ruby:latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/set-up-bashcov
      - name: Run Bundle audit
        id: bundle-audit
        run: |
          bundle exec rake bundle:audit:update
          bundle exec rake bundle:audit:check

  build:
    runs-on: ubuntu-latest
    container: ruby:latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/set-up-bashcov
      - name: Build Bashcov
        id: build-bashcov
        run: |
          bundle exec rake build
          bundle exec rake build:checksum
          cat checksums/*

  cucumber:
    runs-on: ubuntu-latest
    container:
      image: ruby:${{ matrix.ruby-version }}
    strategy:
      fail-fast: false
      matrix:
        bash-version:
          - "5.3"
          - "5.2"
          - "5.1"
          - "5.0"
          - "4.4"
        ruby-version:
          - "3.2"
          - "3.3"
          - "3.4"
          - "4.0"
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/set-up-bashcov
        with:
          bash-version: ${{ matrix.bash-version }}
      - name: Run Cucumber scenarios against Bash ${{ matrix.bash-version }} and Ruby ${{ matrix.ruby-version }}
        id: cucumber-scenarios
        run: |
          # don't run as root: https://github.com/infertux/bashcov/issues/43
          useradd --create-home ciuser
          chown -R ciuser:ciuser .
          su ciuser -c "bundle exec rake cucumber"

  rspec:
    runs-on: ubuntu-latest
    container:
      image: ruby:${{ matrix.ruby-version }}
    strategy:
      fail-fast: false
      matrix:
        bash-version:
          - "5.3"
          - "5.2"
          - "5.1"
          - "5.0"
          - "4.4"
        ruby-version:
          - "3.2"
          - "3.3"
          - "3.4"
          - "4.0"
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/set-up-bashcov
        with:
          bash-version: ${{ matrix.bash-version }}
      - name: Run RSpec tests against Bash ${{ matrix.bash-version }} and Ruby ${{ matrix.ruby-version }}
        run: |
          # don't run as root: https://github.com/infertux/bashcov/issues/43
          useradd --create-home ciuser
          chown -R ciuser:ciuser .
          su ciuser -c "bundle exec rake rspec"

  # Check where Bashcov::Scanner groups lines against shfmt's parser. shfmt
  # is only used here, Bashcov itself does not need it.
  shfmt:
    runs-on: ubuntu-latest
    container: ruby:latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/set-up-bashcov
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Install shfmt
        run: |
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.14.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Compare the scanner with shfmt on the test scripts
        run: |
          shfmt --version
          bundle exec rspec spec/bashcov/scanner_spec.rb --tag shfmt
      - name: Compare the scanner with shfmt on the scripts of the CI image
        continue-on-error: true # report only, as the image changes over time
        run: |
          bundle exec rspec spec/bashcov/scanner_spec.rb --tag shfmt
        env:
          SHFMT_CORPUS: "/usr/bin/* /usr/sbin/* /usr/lib/**/*.sh /usr/share/**/*.sh /usr/local/bundle/**/*.sh"

  rubocop:
    runs-on: ubuntu-latest
    container: ruby:latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/set-up-bashcov
      - name: Lint with RuboCop
        id: rubocop
        run: |
          bundle exec rake rubocop

  yard:
    runs-on: ubuntu-latest
    container: ruby:latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/set-up-bashcov
      - name: Generate documentation with YARD
        id: yard
        run: |
          bundle exec yard stats --list-undoc

  nix:
    runs-on: ubuntu-latest
    continue-on-error: true # don't fail the build if this job fails
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v22
        with:
          extra_nix_config: |
            system-features = benchmark big-parallel kvm nixos-test uid-range
      - name: run flake checks
        run: nix flake check -L
